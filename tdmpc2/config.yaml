defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
episodic: false

# metaworld (custom) — used when task starts with `mw-` or `metaworld_`
image_size: 128
cameras: [topview, front, gripperPOV]
max_episode_steps: 250
action_repeat: 2
cnn_kernel_size: 4
cnn_minres: 4

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 50000
save_freq: 0  # env-step interval for periodic agent checkpoints (0 disables; `final.pt` is always written)

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: ???
wandb_entity: ???
wandb_run_name: ???
wandb_run_id: null      # set by sweep launcher for deterministic resume; null = wandb generates one
wandb_group: null       # overrides the cfg_to_group() default when set (sweep harness uses it for seed grouping)
wandb_tags: null        # list of strings; when set, replaces the default cfg_to_group()+seed tags
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1
# replay buffer persistence (mirrors STORM's train_eps/ scheme)
save_episodes: true
episode_dir: null              # default: {work_dir}/train_eps
buffer_storage_device: auto    # auto | cuda | cpu — `auto` keeps the original mem-free heuristic
prune_every_n_episodes: 5      # how often to FIFO-prune {episode_dir} down to ≤ buffer_size transitions

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
